<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Interview - TTT INTERVIEW MANAGEMENT</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="/">
                TTT INTERVIEW MANAGEMENT
            </a>

        </div>
    </nav>


    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>Edit Interview</h2>

            <a href="/" class="btn btn-secondary">
                Back to Dashboard
            </a>

        </div>


        <div class="card shadow-sm">

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Student
                        </label>

                        <select
                            name="student_id"
                            class="form-select"
                            required
                        >

                            {% for student in students %}

                            <option
                                value="{{ student.id }}"
                                {% if student.id == interview.student_id %}selected{% endif %}
                            >
                                {{ student.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Company
                        </label>

                        <select
                            name="company_id"
                            class="form-select"
                            required
                        >

                            {% for company in companies %}

                            <option
                                value="{{ company.id }}"
                                {% if company.id == interview.company_id %}selected{% endif %}
                            >
                                {{ company.company_name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Interview Date
                        </label>

                        <input
                            type="date"
                            name="interview_date"
                            class="form-control"
                            value="{{ interview.interview_date }}"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select"
                            required
                        >

                            <option
                                value="selected"
                                {% if interview.status == "selected" %}selected{% endif %}
                            >
                                Selected
                            </option>

                            <option
                                value="rejected"
                                {% if interview.status == "rejected" %}selected{% endif %}
                            >
                                Rejected
                            </option>

                            <option
                                value="pending"
                                {% if interview.status == "pending" %}selected{% endif %}
                            >
                                Pending
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Remarks
                        </label>

                        <textarea
                            name="remarks"
                            class="form-control"
                            rows="3"
                        >{{ interview.remarks }}</textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Update Interview
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
