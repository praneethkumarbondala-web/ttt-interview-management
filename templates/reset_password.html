<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - TTT</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .reset-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 5px;
        }

        .title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 13px;
        }

    </style>

</head>

<body>

    <div class="reset-box">

        <div class="logo">TTT</div>

        <div class="title">
            Reset Password
        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <input
                type="password"
                name="password"
                placeholder="New Password"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm New Password"
                required
            >

            <button type="submit">
                Reset Password
            </button>

        </form>

    </div>

</body>

</html>
