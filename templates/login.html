<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TTT Interview Management - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .title {
            font-size: 26px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .create-profile {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .create-profile:hover {
            text-decoration: underline;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 7px;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #9ca3af;
        }


        .password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 45px;
}

.eye-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
}
    
.forgot-password {
    display: block;
    margin-top: 12px;
    color: #2563eb;
    font-size: 13px;
    text-decoration: none;
    text-align: right;
}

.forgot-password:hover {
    text-decoration: underline;
}




    </style>
</head>

<body>

    <div class="login-container">

        <img
            src="{{ url_for('static', filename='ttt.jpeg') }}"
            alt="TTT Logo"
            class="logo"
        >

        <div class="title">
            TTT Interview Management
        </div>

        <div class="subtitle">
            Login to continue
        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="input-group">
                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="input-group">
    <label>Password</label>

    <div class="password-wrapper">

        <input
            type="password"
            name="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <span
            class="eye-icon"
            onclick="togglePassword()"
        >
            👁️
        </span>

    </div>
</div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <a href="/forgot-password" class="forgot-password">
    Forgot Password?
</a>

        </form>

        <a href="/create-profile" class="create-profile">
            Create New Profile
        </a>

        <div class="footer">
            TTT Interview Management System
        </div>

    </div>


    <script>

function togglePassword() {

    const passwordInput = document.getElementById("password");

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
    } else {
        passwordInput.type = "password";
    }

}

</script>

</body>
</html>
