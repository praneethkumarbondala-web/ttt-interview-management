<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Company - TTT INTERVIEW MANAGEMENT</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="/">
                TTT INTERVIEW MANAGEMENT
            </a>

        </div>
    </nav>


    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>Add Company</h2>

            <a href="/" class="btn btn-secondary">
                Back to Dashboard
            </a>

        </div>


        <div class="card shadow-sm">

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Company Name
                        </label>

                        <input
                            type="text"
                            name="company_name"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            HR Name
                        </label>

                        <input
                            type="text"
                            name="hr_name"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            HR Phone
                        </label>

                        <input
                            type="text"
                            name="hr_phone"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            HR Email
                        </label>

                        <input
                            type="email"
                            name="hr_email"
                            class="form-control"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Add Company
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
