<!DOCTYPE html>

<html lang="en">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Student - TTT INTERVIEW MANAGEMENT</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            TTT INTERVIEW MANAGEMENT
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Edit Student</h2>

        <a href="/" class="btn btn-secondary">
            Back to Dashboard
        </a>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">
                        Student Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ student.name }}"
                        required
                    >
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Branch
                    </label>

                    <input
                        type="text"
                        name="branch"
                        class="form-control"
                        value="{{ student.branch }}"
                        required
                    >
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Batch
                    </label>

                    <select
                        name="batch"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Batch
                        </option>

                        <option value="23rd Batch" {% if student.batch == "23rd Batch" %}selected{% endif %}>
                            23rd Batch
                        </option>

                        <option value="24th Batch" {% if student.batch == "24th Batch" %}selected{% endif %}>
                            24th Batch
                        </option>

                        <option value="25th Batch" {% if student.batch == "25th Batch" %}selected{% endif %}>
                            25th Batch
                        </option>

                    </select>
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ student.email }}"
                        required
                    >
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Phone
                    </label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ student.phone }}"
                        required
                    >
                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Update Student
                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
