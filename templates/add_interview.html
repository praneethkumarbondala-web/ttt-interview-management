<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Interview - TTT INTERVIEW MANAGEMENT</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="/">
                TTT INTERVIEW MANAGEMENT
            </a>

        </div>
    </nav>


    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>Add Interview</h2>

            <a href="/" class="btn btn-secondary">
                Back to Dashboard
            </a>

        </div>


        <div class="card shadow-sm">

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Student
                        </label>

                        <select
                            name="student_id"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Student
                            </option>

                            {% for student in students %}

                            <option value="{{ student.id }}">
                                {{ student.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Company
                        </label>

                        <select
                            name="company_id"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Company
                            </option>

                            {% for company in companies %}

                            <option value="{{ company.id }}">
                                {{ company.company_name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Interview Date
                        </label>

                        <input
                            type="date"
                            name="interview_date"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Status
                            </option>

                            <option value="selected">
                                Selected
                            </option>

                            <option value="rejected">
                                Rejected
                            </option>

                            <option value="pending">
                                Pending
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Remarks
                        </label>

                        <textarea
                            name="remarks"
                            class="form-control"
                            rows="3"
                            placeholder="Enter interview remarks"
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Add Interview
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
